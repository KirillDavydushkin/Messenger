<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Перевірка пошти</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
    <tr>
      <td align="center" style="padding:24px 12px;">

        <!-- Рамка з заокругленими кутами, як на макеті -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
               style="max-width:880px;border:1px solid #d1d5db;border-radius:14px;background:#ffffff;">
          <tr>
            <td align="center" style="padding:40px 20px 36px;">

              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:464px;">
                <tr>
                  <td align="left" style="font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif;color:#0a0a14;">

                    <h1 style="margin:0 0 22px;font-size:24px;line-height:32px;font-weight:600;color:#0a0a14;">
                      Вас вітає команда World IT !
                    </h1>

                    <p style="margin:0 0 22px;font-size:16px;line-height:22px;font-weight:400;color:#1f2937;">
                      Щоб завершити реєстрацію та переконатися, що саме ви є
                      власником цієї електронної адреси, будь ласка, підтвердьте
                      свою пошту.
                    </p>

                    <!-- Чорна кнопка на всю ширину -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" bgcolor="#0a0a1a" style="border-radius:4px;background:#0a0a1a;">
                          <a href="{{ confirm_url }}" target="_blank"
                             style="display:block;padding:15px 20px;font-family:Inter,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1;font-weight:500;color:#ffffff;text-decoration:none;">
                            Підтвердити пошту
                          </a>
                        </td>
                      </tr>
                    </table>

                    <!-- Ілюстрація -->
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td align="center" style="padding:30px 0 28px;">
                          <img src="cid:email_art" width="300" alt="Діти за комп'ютером, смайлики та повідомлення"
                               style="display:block;width:300px;max-width:100%;height:auto;border:0;">
                        </td>
                      </tr>
                    </table>

                    <!-- Розділювач -->
                    <div style="border-top:1px solid #d1d5db;font-size:0;line-height:0;height:0;">&nbsp;</div>

                    <p style="margin:24px 0 0;font-size:14px;line-height:20px;font-weight:400;color:#1f2937;">
                      Якщо у вас виникнуть питання — ми завжди раді допомогти!<br>
                      З найкращими побажаннями, команда World IT Academy
                    </p>

                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
